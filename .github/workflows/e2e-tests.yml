name: E2E Tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api
          - smoke
          - regression
          - auth
          - chat
          - dashboard
      environment:
        description: 'Target environment URL'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      browser:
        description: 'Browser to use'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all-browsers

jobs:
  # ─────────────────────────────────────────────
  # Job: Run E2E Tests
  # ─────────────────────────────────────────────
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TEST_SUITE: ${{ github.event.inputs.test_suite || 'all' }}
      TARGET_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
      E2E_BROWSER: ${{ github.event.inputs.browser || 'chromium' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup Node.js ─────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      # ── Install Playwright Dependencies ───────
      - name: Install E2E dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: |
          if [ "${E2E_BROWSER}" = "all-browsers" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps "${E2E_BROWSER}"
          fi

      # ── Determine base URL ────────────────────
      - name: Set environment URL
        id: env-url
        run: |
          if [ "${TARGET_ENVIRONMENT}" == "production" ]; then
            echo "base_url=${{ secrets.PROD_BASE_URL || 'https://vgfriend.io.vn' }}" >> $GITHUB_OUTPUT
            echo "api_url=${{ secrets.PROD_API_URL || 'https://vgfriend.io.vn/api' }}" >> $GITHUB_OUTPUT
          else
            echo "base_url=${{ secrets.STAGING_BASE_URL || 'https://staging.vgfriend.io.vn' }}" >> $GITHUB_OUTPUT
            echo "api_url=${{ secrets.STAGING_API_URL || 'https://staging.vgfriend.io.vn/api' }}" >> $GITHUB_OUTPUT
          fi

      # ── Run E2E Tests ─────────────────────────
      - name: Run E2E Tests
        id: run-tests
        working-directory: ./e2e
        env:
          CI: true
          BASE_URL: ${{ steps.env-url.outputs.base_url }}
          API_BASE_URL: ${{ steps.env-url.outputs.api_url }}
          TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.E2E_TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.E2E_TEST_ADMIN_PASSWORD }}
        run: |
          case "${TEST_SUITE}" in
            api) npm run test:api ;;
            smoke) npm run test:smoke ;;
            regression) npm run test:regression ;;
            auth) npm run test:auth ;;
            chat) npm run test:chat ;;
            dashboard) npm run test:dashboard ;;
            all)
              case "${E2E_BROWSER}" in
                chromium) npm run test:headless ;;
                firefox) npx playwright test --project=firefox ;;
                webkit) npx playwright test --project=webkit ;;
                all-browsers) npm run test:all-browsers ;;
                *) npm run test:headless ;;
              esac
              ;;
            *) npm run test:headless ;;
          esac 2>&1 | tee /tmp/test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      # ── Parse Test Results ────────────────────
      - name: Parse test results
        id: parse-results
        if: always()
        run: |
          RESULTS_FILE="./e2e/test-results/results.json"

          if [ -f "$RESULTS_FILE" ]; then
            TOTAL=$(cat "$RESULTS_FILE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('stats', {}).get('expected', 0) + d.get('stats', {}).get('unexpected', 0) + d.get('stats', {}).get('skipped', 0))" 2>/dev/null || echo "0")
            PASSED=$(cat "$RESULTS_FILE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('stats', {}).get('expected', 0))" 2>/dev/null || echo "0")
            FAILED=$(cat "$RESULTS_FILE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('stats', {}).get('unexpected', 0))" 2>/dev/null || echo "0")
            SKIPPED=$(cat "$RESULTS_FILE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('stats', {}).get('skipped', 0))" 2>/dev/null || echo "0")
            DURATION=$(cat "$RESULTS_FILE" | python3 -c "import json,sys; d=json.load(sys.stdin); ms=d.get('stats', {}).get('duration', 0); print(f'{ms//60000}m {(ms%60000)//1000}s')" 2>/dev/null || echo "unknown")
          else
            TOTAL="0"
            PASSED="0"
            FAILED="0"
            SKIPPED="0"
            DURATION="unknown"
          fi

          echo "total=${TOTAL}" >> $GITHUB_OUTPUT
          echo "passed=${PASSED}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED}" >> $GITHUB_OUTPUT
          echo "skipped=${SKIPPED}" >> $GITHUB_OUTPUT
          echo "duration=${DURATION}" >> $GITHUB_OUTPUT

          echo "📊 Results: Total=${TOTAL}, Passed=${PASSED}, Failed=${FAILED}, Skipped=${SKIPPED}, Duration=${DURATION}"

      # ── Upload Test Report ────────────────────
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      # ── Fail job if tests failed ──────────────
      - name: Check test results
        if: steps.run-tests.outputs.exit_code != '0'
        run: |
          echo "❌ E2E tests failed! Check the Playwright report artifact for details."
          exit 1
